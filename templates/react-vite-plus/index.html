<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arizona Athletics — React + Vite+ starter</title>
    <meta name="description" content="University of Arizona Athletics starter template (React 19 + Vite+ + Arizona Bootstrap)." />

    <script>
      (function () {
        try {
          var stored = localStorage.getItem("ua-theme");
          var mode = stored || "system";
          var resolved = mode === "system"
            ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
            : mode;
          var html = document.documentElement;
          html.dataset.theme = resolved;
          html.dataset.bsTheme = resolved;
          html.dataset.themeMode = mode;
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>

    <link rel="stylesheet" href="https://cdn.digital.arizona.edu/lib/arizona-bootstrap/5.1.3/css/arizona-bootstrap.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">

    <!-- CONFIGURE_ME: replace with your unit's Adobe Fonts kit ID -->
    <!-- <link rel="stylesheet" href="https://use.typekit.net/YOUR_KIT_ID.css"> -->

    <link rel="icon" type="image/svg+xml" href="/block-a.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script src="https://cdn.digital.arizona.edu/lib/arizona-bootstrap/5.1.3/js/arizona-bootstrap.bundle.min.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
