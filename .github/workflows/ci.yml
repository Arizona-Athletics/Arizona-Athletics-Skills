name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    name: Build and drift checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.140.0"
          extended: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check token dist
        run: bun run check:token-dist

      - name: Check template token vendors
        run: bun run check:template-token-vendors

      - name: Build token package
        run: bun run build

      - name: Check standalone templates
        run: bun run check:standalone-templates
