name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    name: Build and drift checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.140.0"
          extended: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check token dist
        run: bun run check:token-dist

      - name: Check template token vendors
        run: bun run check:template-token-vendors

      - name: Build token package
        run: bun run build

      - name: Type-check packages
        run: bun run check

      - name: Validate tokens.json against schema
        run: bunx ajv-cli validate --spec=draft2020 -s packages/ua-tokens/tokens.schema.json -d packages/ua-tokens/tokens.json

      - name: Brand compliance lint (templates/)
        run: bun run check:compliance

      - name: Skill checks (frontmatter, project copies, bundle freshness)
        run: bun run check:skills

      - name: WCAG AA contrast audit
        run: bun run check:contrast

      - name: Check standalone templates
        run: bun run check:standalone-templates
